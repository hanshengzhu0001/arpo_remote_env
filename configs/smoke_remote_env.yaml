# Remote env: EXECUTIONS on AWS EC2 (xlang-ai/OSWorld, PROVIDER=aws), TRAINING on cluster.
# Use when the cluster can reach the EC2 host (public IP + security group allows 15001).
#
# Architecture:
#   - Resource (GPUs, model, rollout): cluster.
#   - Executions (reset/step/evaluate): remote server on EC2 (PROVIDER=aws); see docs/REMOTE_ENV_SERVER_RUNBOOK.md.
#
# 1) On EC2 (e.g. 18.206.172.166): cd ~/arpo_remote_env && source arpo_env/bin/activate && ./scripts/start_remote_env_aws.sh
# 2) Test from cluster (reset can take 1-5 min: VM + Chrome): curl -s -w "\\nHTTP %{http_code} time %{time_total}s\\n" -X POST http://<EC2_IP>:15001/env/reset -H "Content-Type: application/json" -d '{"task_config":{}}' --max-time 300
#    If 500 "VM failed to become ready within timeout": on server (no KVM) set DOCKER_VM_READY_TIMEOUT=1800 and create evaluation_examples/settings/proxy/dataimpulse.json (echo '{}').
#    Common 503 cause: server needs AWS creds + boto3. Configure on the SERVER host (18.206.172.166), NOT on the training machine:
#    SSH to 18.206.172.166 -> in arpo_remote_env venv: pip install boto3 && aws configure (or attach IAM role to that EC2).
#    Subnet/sg (e.g. subnet-02691b301586ea09b, sg-004fb15195b7f3715) are where to launch envs; credentials are still required to call EC2 APIs.
# 3) In this config: env.remote_server_url must be http://<EC2_IP>:15001 (e.g. http://18.206.172.166:15001)
# 4) On cluster: python -m verl.trainer.main config=configs/smoke_remote_env.yaml
# Note: Config key is remote_server_url (not remote_env_url).

data:
  # Use OSWorld/evaluation_examples so dataset finds examples/<domain>/<id>.json
  train_files: OSWorld/evaluation_examples/test_smoke_4.json
  val_files: OSWorld/evaluation_examples/test_smoke_4.json
  prompt_key: instruction
  answer_key: ""
  image_key: images
  # Context length for multi-turn trajectory with screenshots.
  # 8192 allows ~8-10 steps of history; increase to 16384 for full 16-step context if memory permits.
  max_prompt_length: 8192
  max_response_length: 512
  rollout_batch_size: 1  # 1 env on remote server (smoke_4gpu uses 4)
  val_batch_size: -1
  shuffle: true
  seed: 1
  max_pixels: 262144   # fit for 1920 x 1280
  min_pixels: 2800

algorithm:
  adv_estimator: grpo   # ARPO: group-relative advantage (needs rollout.n > 1 and multiple samples per task)
  disable_kl: true     # ARPO: no KL penalty
  use_kl_loss: false
  kl_coef: 0           # ARPO: must be 0 when disable_kl
  enable_replay: true  # ARPO: experience replay

worker:
  actor:
    global_batch_size: 8  # Must be >= n_gpus_per_node for FSDP. Batch is padded to this size if smaller.
    # global_batch_size is multiplied by rollout.n internally (8*2=16), so per-device = 16/8 = 2.
    # Must equal global_batch_size_per_device to avoid gradient accumulation (required for FSDP CPU offload).
    micro_batch_size_per_device_for_update: 2
    micro_batch_size_per_device_for_experience: 1
    max_grad_norm: 1.0
    padding_free: false
    ulysses_sequence_parallel_size: 1
    ppo_epochs: 1
    clip_ratio_low: 0.2
    clip_ratio_high: 0.3
    model:
      model_path: ByteDance-Seed/UI-TARS-2B-SFT
      enable_gradient_checkpointing: true
      trust_remote_code: true
      freeze_vision_tower: false
      override_config:
        _attn_implementation: "eager"
    optim:
      lr: 1.0e-6
      weight_decay: 1.0e-2
      strategy: adamw
      lr_warmup_ratio: 0.05
    fsdp:
      enable_full_shard: true
      # Enable FSDP CPU offload in addition to manual offload for maximum memory reduction
      enable_cpu_offload: true
      # Disable rank0 init to reduce peak GPU memory during FSDP model initialization
      enable_rank0_init: false
    offload:
      # Enable CPU offload for both params and optimizer to minimize GPU memory during init
      offload_params: true
      offload_optimizer: true

  rollout:
    temperature: 0.7
    n: 2  # GRPO requires n > 1; with 1 env these run sequentially (2 rollouts per task)
    # Increase GPU memory utilization for vLLM KV cache (was 0.05, too low after FSDP init)
    gpu_memory_utilization: 0.10
    # Enable eager mode to disable torch.compile and reduce memory usage
    enforce_eager: true
    enable_chunked_prefill: false
    tensor_parallel_size: 1
    limit_images: 10
    # Qwen2VL/UI-TARS image processor expects size.shortest_edge/longest_edge (not min/max_pixels from repo config).
    # Keep image_max_pixels at 2116800 so vLLM profiler expected token count matches processed dummy (26010); data.max_pixels still resizes env images to 262144.
    image_min_pixels: 3136
    image_max_pixels: 2116800
    # Must be >= max_prompt_length + max_response_length for vLLM
    max_num_batched_tokens: 16384
    val_override_config:
      temperature: 0.5
      n: 1

  ref:
    fsdp:
      enable_full_shard: true
      # Keep ref on CPU to free GPU for actor_rollout (avoids OOM at barrier during init)
      enable_cpu_offload: true
    offload:
      offload_params: true

  reward:
    reward_type: function
    score_function: math
    skip_special_tokens: true

env:
  num_envs: 1  # 1 env with sequential rollouts (rollout.n=2 -> 2 trajectories per task, run sequentially)
  max_steps: 16
  screen_size: [1920, 1080]
  # EC2 IP where the remote env server runs. Test: curl -s -X POST http://54.91.149.177:15001/env/reset -H "Content-Type: application/json" -d '{"task_config":{}}'
  # 503 with "AWS provider requires... boto3" -> on that EC2 host: pip install boto3 && aws configure (or IAM role with RunInstances, DescribeInstances, StartInstances, StopInstances).
  remote_server_url: "http://54.91.149.177:15001"

trainer:
  total_episodes: 10
  logger: ["console", "wandb"]
  project_name: arpo-smoke-test
  experiment_name: uitars_2b_remote_env
  wandb_entity: hanszhu05-university-of-pennsylvania
  n_gpus_per_node: 8
  nnodes: 1
